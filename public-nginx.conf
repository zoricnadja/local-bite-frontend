server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The public tunnel exposes only the scan screen, its assets and read-only PDF/API.
    location ~ "^/trace/[0-9a-fA-F-]{36}/?$" {
        limit_except GET { deny all; }
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }
    location ~ "^/api/products/public/[0-9a-fA-F-]{36}(/certificate\.pdf)?$" {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $products_upstream products-service:3003;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$products_upstream;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }
    location ~ ^/(main|polyfills|chunk)-[A-Za-z0-9]+\.js$ {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location ~ ^/styles-[A-Za-z0-9]+\.css$ { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }
    location / { return 404; }
}
